    <text class="box-note" x="972" y="292" font-size="8" fill="#374151">whole book, every</text>
    <text class="box-note" x="972" y="310" font-size="8" fill="#374151">time (3 recipes: fine)</text>
    <rect class="box" x="1141" y="250" width="155" height="150" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
