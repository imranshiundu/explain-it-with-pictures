<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Explain It With Pictures — diagram kit</title>
  <desc>The reference kit: every diagram type with its use case, plus the locked conventions.

GEOMETRY (checker-enforced): box width = widest line + 2 x 14px side padding, minimum; 8px clear
between text (descenders included) and every box edge; boxes at least 24px apart; labels in gutters,
8px from box edges; arrows start and end at box edges; no text ever touches or overlaps text.
TYPE SCALE (five sizes, far apart): Display (titles) / Head (sections) / Lead (statements) /
Body 17-19px / Small 13-14px. Tracking tightens as size grows. Text left-aligned, max 75 characters.
SPACING: base 4px - steps of 4, 8, 12, 16, 24, 32, 48, 64. Section gaps 120-220px.
COLOR ROLES: ground (most of the surface), surface (one tone step up), ink, muted, accent
(action only, under 5%). Diagram semantics live inside figures only: blue front end, green server,
amber data, red errors, gray outside world. Every text pair passes 4.5:1, graphics 3:1.</desc>

  <rect x="0" y="0" width="1400" height="960" fill="#F2F0E9"/>

  <text x="40" y="48" font-size="26" font-weight="650" letter-spacing="-0.3" fill="#111827">Explain It With Pictures — diagram kit</text>
  <text x="40" y="72" font-size="13" fill="#4B5563">Eight ways to draw one question. Pick the type by the question; keep the conventions; let the checker hold the geometry.</text>

