    <text x="936" y="212" font-size="11" font-weight="650" fill="#111827">COMPARISON</text>
    <text x="936" y="434" font-size="9" fill="#4B5563">Use when: before and after, shared parts aligned.</text>
    <text x="1033" y="234" font-size="10" font-weight="650" fill="#111827" text-anchor="middle">Before</text>
