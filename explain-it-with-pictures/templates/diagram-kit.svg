    <text x="95" y="156" font-size="8" fill="#4B5563">Display — titles</text>
    <text x="205" y="143" font-size="17" font-weight="650" fill="#111827">Aa</text>
    <text x="238" y="156" font-size="8" fill="#4B5563">Head — sections</text>
    <text x="365" y="141" font-size="14" fill="#111827">Aa</text>
    <text x="395" y="156" font-size="8" fill="#4B5563">Lead — statements</text>
    <text x="530" y="140" font-size="12" fill="#111827">Aa</text>
    <text x="558" y="156" font-size="8" fill="#4B5563">Body — 17–19px</text>
    <text x="680" y="139" font-size="10" fill="#111827">Aa</text>
    <text x="706" y="156" font-size="8" fill="#4B5563">Small — captions</text>
  </g>

