<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>What happens when you save a recipe</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3f3f46"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <path id="cursor" d="M 0 0 L 0 14 L 4 11 L 6.5 16.5 L 8.5 15.5 L 6 10 L 11 10 Z" fill="#111827"/>
  </defs>

  <text x="24" y="40" font-size="22" font-weight="700" fill="#111827">What happens when you save a recipe</text>
  <text x="24" y="60" font-size="12" fill="#64748b">(simplified — the real code also handles searching and a few safety checks)</text>

  <g>
    <rect x="20" y="70" width="260" height="360" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="36" y="90" font-size="12" font-weight="700" letter-spacing="1.5" fill="#2563eb">WHAT YOU SEE</text>
    <rect x="340" y="70" width="300" height="360" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="356" y="90" font-size="12" font-weight="700" letter-spacing="1.5" fill="#16a34a">THE SERVER CODE</text>
    <rect x="700" y="70" width="240" height="360" rx="14" fill="#fffbeb" stroke="#fde68a"/>
    <text x="716" y="90" font-size="12" font-weight="700" letter-spacing="1.5" fill="#d97706">WHERE YOUR DATA LIVES</text>
  </g>

  <g>
    <rect x="48" y="130" width="204" height="104" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="60" cy="130" r="12" fill="#111827"/>
    <text x="60" y="134" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="150" y="168" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">The page you see</text>
    <text x="150" y="188" font-size="12" fill="#6b7280" text-anchor="middle">public/index.html</text>
    <text x="150" y="210" font-size="13" fill="#111827" text-anchor="middle">you type your recipe,</text>
    <text x="150" y="228" font-size="13" fill="#111827" text-anchor="middle">then click Save</text>
    <use href="#cursor" x="212" y="218"/>
  </g>

  <g>
    <rect x="372" y="130" width="236" height="104" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <circle cx="384" cy="130" r="12" fill="#111827"/>
    <text x="384" y="134" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="490" y="168" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">The kitchen — your server</text>
    <text x="490" y="188" font-size="12" fill="#6b7280" text-anchor="middle">server.js</text>
    <text x="490" y="212" font-size="13" fill="#111827" text-anchor="middle">checks: has it got a title?</text>
  </g>

  <g>
    <rect x="724" y="130" width="192" height="104" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="820" y="168" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Your recipes file</text>
    <text x="820" y="188" font-size="12" fill="#6b7280" text-anchor="middle">recipes.json</text>
    <text x="820" y="212" font-size="13" fill="#111827" text-anchor="middle">one list, saved on disk</text>
  </g>

  <g>
    <line x1="252" y1="182" x2="366" y2="182" stroke="#3f3f46" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="310" cy="182" r="12" fill="#111827"/>
    <text x="310" y="186" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="310" y="210" font-size="12" fill="#374151" text-anchor="middle">your recipe,</text>
    <text x="310" y="226" font-size="12" fill="#374151" text-anchor="middle">as a message</text>
  </g>

  <g>
    <line x1="608" y1="182" x2="718" y2="182" stroke="#3f3f46" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="663" cy="182" r="12" fill="#111827"/>
    <text x="663" y="186" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="663" y="210" font-size="12" fill="#374151" text-anchor="middle">the finished</text>
    <text x="663" y="226" font-size="12" fill="#374151" text-anchor="middle">recipe</text>
  </g>

  <g>
    <path d="M 560 130 C 560 108, 240 108, 240 130" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
    <text x="400" y="106" font-size="12.5" font-style="italic" fill="#dc2626" text-anchor="middle">if something is missing: a friendly error</text>
  </g>

  <g>
    <path d="M 490 234 C 490 320, 150 320, 150 234" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
    <circle cx="320" cy="298" r="12" fill="#111827"/>
    <text x="320" y="302" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="320" y="326" font-size="12.5" fill="#2563eb" text-anchor="middle">your updated list — the page quietly asks for it</text>
  </g>

  <g>
    <rect x="14" y="444" width="932" height="96" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="28" y="456" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb"/>
    <text x="48" y="468" font-size="12" fill="#374151">what you see (the front end)</text>
    <rect x="260" y="456" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/>
    <text x="280" y="468" font-size="12" fill="#374151">server code</text>
    <rect x="380" y="456" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="400" y="468" font-size="12" fill="#374151">where data lives</text>
    <line x1="540" y1="463" x2="572" y2="463" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="580" y="468" font-size="12" fill="#374151">a problem (error)</text>
    <line x1="28" y1="501" x2="60" y2="501" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="68" y="506" font-size="12" fill="#374151">a reply coming back</text>
    <circle cx="244" cy="501" r="12" fill="#111827"/>
    <text x="244" y="505" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="264" y="506" font-size="12" fill="#374151">numbers = story order</text>
    <use href="#cursor" x="440" y="492"/>
    <text x="460" y="506" font-size="12" fill="#374151">where you (the human) act</text>
  </g>
</svg>
