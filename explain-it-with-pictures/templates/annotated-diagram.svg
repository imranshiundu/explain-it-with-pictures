<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>What happens when you save a recipe</title>
  <desc>Annotated-diagram conventions: labeled zones, dual-labeled boxes, numbered story bubbles on labeled arrows, a zoom-in inset, a legend. Classes (zone, zlabel, box, box-title, box-sub, box-note, bubble, num, edge, lbl) plus pathLength="1" on edges make the diagram scroll-animated when embedded in the explainer page.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E11D48"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
    <path id="cursor" d="M 0 0 L 0 14 L 4 11 L 6.5 16.5 L 8.5 15.5 L 6 10 L 11 10 Z" fill="#2a2a26"/>
  </defs>

  <text x="24" y="40" font-size="22" font-weight="500" letter-spacing="-0.3" fill="#2a2a26">What happens when you save a recipe</text>
  <text x="24" y="60" font-size="12" fill="#475569">(simplified — the real code also handles searching and a few safety checks)</text>

  <g>
    <rect class="zone" x="20" y="70" width="260" height="360" rx="18" fill="#EEF4FF" stroke="#D8E2F8"/>
    <text class="zlabel" x="36" y="90" font-size="13" font-weight="500" fill="#1d4ed8">What you see</text>
    <rect class="zone" x="340" y="70" width="300" height="360" rx="18" fill="#ECFDF5" stroke="#C6EEDD"/>
    <text class="zlabel" x="356" y="90" font-size="13" font-weight="500" fill="#047857">The server code</text>
    <rect class="zone" x="700" y="70" width="240" height="360" rx="18" fill="#FFFBEB" stroke="#F3E5B8"/>
    <text class="zlabel" x="716" y="90" font-size="13" font-weight="500" fill="#b45309">Where your data lives</text>
  </g>

  <g>
    <rect class="box" x="48" y="130" width="204" height="104" rx="14" fill="#dbeafe" stroke="#93C5FD" stroke-width="1.5"/>
    <g class="bubble"><circle cx="60" cy="130" r="12" fill="#2a2a26"/>/>
      <text x="60" y="134" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>></g>
    <text class="box-title" x="150" y="168" font-size="16" font-weight="500" fill="#2a2a26" text-anchor="middle">The page you see</text>
    <text class="box-sub" x="150" y="188" font-size="12" fill="#475569" text-anchor="middle">public/index.html</text>
    <text class="box-note" x="150" y="202" font-size="13" fill="#334155" text-anchor="middle">you type your recipe,</text>
    <text class="box-note" x="150" y="220" font-size="13" fill="#334155" text-anchor="middle">then click Save</text>
    <use href="#cursor" x="212" y="218"/>
  </g>

  <g>
    <rect class="box" x="372" y="130" width="236" height="104" rx="14" fill="#d1fae5" stroke="#6EE7B7" stroke-width="1.5"/>
    <g class="bubble"><circle cx="384" cy="130" r="12" fill="#2a2a26"/>/>
      <text x="384" y="134" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>></g>
    <text class="box-title" x="490" y="168" font-size="16" font-weight="500" fill="#2a2a26" text-anchor="middle">The kitchen — server</text>
    <text class="box-sub" x="490" y="188" font-size="12" fill="#475569" text-anchor="middle">server.js</text>
    <text class="box-note" x="490" y="206" font-size="13" fill="#334155" text-anchor="middle">checks: has it a title?</text>
  </g>

  <g>
    <rect class="box" x="724" y="130" width="192" height="104" rx="14" fill="#fef3c7" stroke="#FCD34D" stroke-width="1.5"/>
    <text class="box-title" x="820" y="168" font-size="16" font-weight="500" fill="#2a2a26" text-anchor="middle">Your recipe book</text>
    <text class="box-sub" x="820" y="188" font-size="12" fill="#475569" text-anchor="middle">recipes.json</text>
    <text class="box-note" x="820" y="206" font-size="13" fill="#334155" text-anchor="middle">one list, on disk</text>
  </g>

  <g>
    <line class="edge" pathLength="1" x1="252" y1="182" x2="366" y2="182" stroke="#475569" stroke-width="2.25" marker-end="url(#arrow)"/>
    <g class="bubble"><circle cx="310" cy="182" r="12" fill="#2a2a26"/>/>
      <text x="310" y="186" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>></g>
    <text class="lbl" x="310" y="210" font-size="12" fill="#374151" text-anchor="middle">your recipe,</text>
    <text class="lbl" x="310" y="226" font-size="12" fill="#374151" text-anchor="middle">as a message</text>
  </g>

  <g>
    <line class="edge" pathLength="1" x1="608" y1="182" x2="718" y2="182" stroke="#475569" stroke-width="2.25" marker-end="url(#arrow)"/>
    <g class="bubble"><circle cx="663" cy="182" r="12" fill="#2a2a26"/>/>
      <text x="663" y="186" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>></g>
    <text class="lbl" x="663" y="210" font-size="12" fill="#374151" text-anchor="middle">the finished</text>
    <text class="lbl" x="663" y="226" font-size="12" fill="#374151" text-anchor="middle">recipe</text>
  </g>

  <g>
    <path class="edge" pathLength="1" d="M 560 130 C 560 108, 240 108, 240 130" fill="none" stroke="#E11D48" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
    <text class="lbl" x="400" y="106" font-size="12.5" font-style="italic" fill="#BE123C" text-anchor="middle">if something is missing: a friendly error</text>
  </g>

  <g>
    <path class="edge" pathLength="1" d="M 490 234 C 490 320, 150 320, 150 234" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
    <g class="bubble"><circle cx="320" cy="298" r="12" fill="#2a2a26"/>/>
      <text x="320" y="302" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>></g>
    <text class="lbl" x="320" y="326" font-size="12.5" font-weight="550" fill="#1D4ED8" text-anchor="middle">your updated list — the page quietly asks for it</text>
  </g>

  <g class="legend">
    <rect x="14" y="454" width="932" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect class="lbl" x="28" y="466" width="14" height="14" rx="4" fill="#DBEAFE" stroke="#93C5FD"/>
    <text class="lbl" x="48" y="478" font-size="12" fill="#475569">what you see (the front end)</text>
    <rect class="lbl" x="260" y="466" width="14" height="14" rx="4" fill="#D1FAE5" stroke="#6EE7B7"/>
    <text class="lbl" x="280" y="478" font-size="12" fill="#475569">server code</text>
    <rect class="lbl" x="380" y="466" width="14" height="14" rx="4" fill="#FEF3C7" stroke="#FCD34D"/>
    <text class="lbl" x="400" y="478" font-size="12" fill="#475569">where data lives</text>
    <line class="lbl" x1="540" y1="473" x2="572" y2="473" stroke="#E11D48" stroke-width="2" stroke-dasharray="6 4"/>
    <text class="lbl" x="580" y="478" font-size="12" fill="#475569">a problem (error)</text>
    <line class="lbl" x1="28" y1="511" x2="60" y2="511" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4"/>
    <text class="lbl" x="68" y="516" font-size="12" fill="#475569">a reply coming back</text>
    <circle class="lbl" cx="244" cy="511" r="12" fill="#2a2a26"/>
    <text x="244" y="515" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text class="lbl" x="264" y="516" font-size="12" fill="#475569">numbers = story order</text>
    <use class="lbl" href="#cursor" x="440" y="502"/>
    <text class="lbl" x="460" y="516" font-size="12" fill="#475569">where you (the human) act</text>
  </g>
</svg>
