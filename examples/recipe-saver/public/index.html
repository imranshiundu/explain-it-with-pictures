<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Saver</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <main>
    <h1>Recipe Saver</h1>
    <form id="recipe-form">
      <label>Title <input name="title" placeholder="Grandma's chapati" required></label>
      <label>Ingredients <textarea name="ingredients" placeholder="Flour, water, salt"></textarea></label>
      <label>Steps <textarea name="steps" placeholder="Mix, knead, rest, roll, cook"></textarea></label>
      <button type="submit">Save recipe</button>
      <p id="form-message" role="status"></p>
    </form>
    <input id="search" type="search" placeholder="Search your recipes..." aria-label="Search your recipes">
    <ul id="recipe-list"></ul>
  </main>
  <script src="/public/app.js"></script>
</body>
</html>
