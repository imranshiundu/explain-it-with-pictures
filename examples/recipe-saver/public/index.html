<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Saver</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%98%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <main>
    <header>
      <p class="kicker">Your recipe book</p>
      <h1>Recipe Saver</h1>
    </header>
    <form id="recipe-form">
      <label>Title <input name="title" placeholder="Grandma's chapati" required></label>
      <label>Ingredients <textarea name="ingredients" rows="2" placeholder="Flour, water, salt"></textarea></label>
      <label>Steps <textarea name="steps" rows="3" placeholder="Mix, knead, rest for 30 minutes, roll thin, cook on a hot pan"></textarea></label>
      <button type="submit">Save recipe</button>
      <p id="form-message" role="status" aria-live="polite"></p>
    </form>
    <input id="search" type="search" placeholder="Search your recipes…" aria-label="Search your recipes">
    <ul id="recipe-list"></ul>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/public/app.js"></script>
</body>
</html>
